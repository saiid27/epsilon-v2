name: Build APK

# Run from the Actions tab (Run workflow) or on push to the branch below.
# The APK is attached to the run as an artifact named "epsilon-apk".
on:
  workflow_dispatch:
  push:
    branches: [ccr-3e135276-npbq5o]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # The same Flutter version the project is built with locally.
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - uses: actions/upload-artifact@v4
        with:
          name: epsilon-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
